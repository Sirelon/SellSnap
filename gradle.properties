# The Kotlin/Native release link of the iOS framework is the peak-memory task in this
# build and runs in the Kotlin daemon, which inherits these args. At 4g it died with
# "OutOfMemoryError: Java heap space" partway through an App Store archive.
org.gradle.jvmargs=-Xmx8g
android.useAndroidX=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
