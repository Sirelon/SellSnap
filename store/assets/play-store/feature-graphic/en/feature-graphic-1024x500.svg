<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F08030"/>
      <stop offset="1" stop-color="#D0600A"/>
    </linearGradient>
    <linearGradient id="warmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F2"/>
      <stop offset="0.58" stop-color="#FFF0E0"/>
      <stop offset="1" stop-color="#FFD8B0"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5C2E00" flood-opacity="0.18"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5C2E00" flood-opacity="0.14"/>
    </filter>
    <style>
      .font { font-family: "Manrope", "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 52px; line-height: 1; font-weight: 850; fill: #3A1F00; letter-spacing: 0; }
      .subtitle { font-size: 27px; font-weight: 650; fill: #7A5030; letter-spacing: 0; }
      .chipText { font-size: 22px; font-weight: 760; fill: #5C2E00; letter-spacing: 0; }
      .smallText { font-size: 20px; font-weight: 760; fill: #FFFFFF; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1024" height="500" rx="0" fill="url(#warmBg)"/>
  <circle cx="872" cy="68" r="138" fill="#F08030" opacity="0.12"/>
  <circle cx="726" cy="424" r="128" fill="#D0600A" opacity="0.10"/>
  <circle cx="120" cy="430" r="104" fill="#FBBF24" opacity="0.12"/>

