<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SellSnap — AI-Powered Marketplace Listings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Inter', system-ui, sans-serif; background: #12080024; }
  body {
    background:
      radial-gradient(1200px 800px at 20% 10%, #FFE4C8 0%, transparent 50%),
      radial-gradient(1200px 800px at 80% 90%, #FFD5AF 0%, transparent 50%),
      #FFF0E0;
    min-height: 100vh;
    overflow: auto;
  }
  .stage {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px; gap: 40px;
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes pulseScale { from { transform: scale(1) } to { transform: scale(1.08) } }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5 } 40% { transform: scale(1); opacity: 1 } }
  @keyframes drift { from { transform: translate(0, 0) } to { transform: translate(40px, -30px) } }
  @keyframes confetti {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1 }
    100% { transform: translateY(120vh) rotate(720deg); opacity: 0 }
  }
  button:focus-visible { outline: 2px solid #F08030; outline-offset: 2px; }

  /* Tweaks panel */
  .tweaks {
    position: fixed; right: 20px; bottom: 20px; z-index: 1000;
    width: 280px; max-height: calc(100vh - 40px); overflow: auto;
    background: rgba(255, 248, 242, 0.95); backdrop-filter: blur(16px);
    border: 1px solid rgba(217, 160, 112, 0.4);
    border-radius: 18px; padding: 16px;
    box-shadow: 0 20px 50px -12px rgba(58, 31, 0, 0.25);
    font-family: 'Inter', system-ui; color: #3A1F00;
    display: none;
  }
  .tweaks.on { display: block; }
  .tweaks h3 { font-family: 'Manrope'; font-size: 15px; margin: 0 0 12px; letter-spacing: -0.2px; }
  .tweak-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .tweak-row label { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: #7A5030; }
  .tweak-seg { display: flex; gap: 4px; background: #FFE4C8; padding: 3px; border-radius: 10px; }
  .tweak-seg button { flex: 1; border: none; background: transparent; padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: #7A5030; font-family: inherit; }
  .tweak-seg button.sel { background: #fff; color: #D0600A; box-shadow: 0 1px 3px rgba(58,31,0,0.12); }
  .tweak-slider { width: 100%; accent-color: #D0600A; }
  .tweak-nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .tweak-nav button { padding: 6px 10px; font-size: 11px; border-radius: 8px; border: 1px solid rgba(217,160,112,0.5); background: #fff; color: #3A1F00; cursor: pointer; font-family: inherit; font-weight: 500; }
  .tweak-nav button.cur { background: #D0600A; color: #fff; border-color: #D0600A; }

  .overview-title {
    position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    font-family: 'Manrope'; font-weight: 700; font-size: 14px; color: #5C2E00;
    letter-spacing: 0.4px;
  }
  .overview-sub {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    font-family: 'Inter'; font-size: 13px; color: #7A5030;
  }
  .screen-label {
    text-align: center; font-family: 'Manrope'; font-size: 12px; font-weight: 700;
    letter-spacing: 0.8px; text-transform: uppercase; color: #7A5030; margin-top: 14px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="tokens.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="placeholders.jsx"></script>
<script type="text/babel" src="screens1.jsx"></script>
<script type="text/babel" src="screens2.jsx"></script>
<script type="text/babel" src="sheets.jsx"></script>
<script type="text/babel" src="screens3.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "startScreen": "onboarding",
  "aiSpeedMs": 1300,
  "layout": "all"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = React.useState(() => {
    try { return { ...TWEAK_DEFAULTS, ...(JSON.parse(localStorage.getItem('sellsnap-tweaks') || '{}')) }; }
    catch { return TWEAK_DEFAULTS; }
  });
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    try { localStorage.setItem('sellsnap-tweaks', JSON.stringify(next)); } catch {}
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch {}
  };

  // Edit-mode protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', handler);
  }, []);

  const theme = tweaks.theme === 'dark' ? window.TOKENS.dark : window.TOKENS.light;
  const ctx = { c: theme, dark: tweaks.theme === 'dark' };

  // Global state
  const [screen, setScreen] = React.useState(() => {
    try { return localStorage.getItem('sellsnap-screen') || tweaks.startScreen; }
    catch { return tweaks.startScreen; }
  });

  React.useEffect(() => {
    try { localStorage.setItem('sellsnap-screen', screen); } catch {}
  }, [screen]);

  const [photos, setPhotos] = React.useState([
    { kind: 'jacket', hue: 28 },
    { kind: 'jacket', hue: 38 },
    { kind: 'jacket', hue: 22 },
  ]);
  const [hint, setHint] = React.useState('');

  const DEFAULT_AD = {
    photos: photos,
    title: 'Зимова куртка The North Face Nuptse 700, розмір M, чорна',
    description: 'Оригінальна пухова куртка The North Face Nuptse з наповнювачем 700 fill-power. Носилась одну зиму, у чудовому стані, без плям і затяжок. Дуже тепла, витримує -20°C. Розмір M (50-52).\n\nКупувалась у офіційному магазині. Є бірки, чек зберігся. Продаю, бо замовив нову модель.\n\nМожлива доставка Новою Поштою по всій Україні.',
    price: 3200,
    priceMin: 1800,
    priceMax: 4800,
    priceSuggested: 3400,
    category: ['Мода і стиль', 'Жіночий одяг', 'Куртки та пуховики', 'Зимові'],
    location: 'Київ, Поділ',
    attributes: [
      { name: 'Стан', value: 'Б/в — відмінний', required: true, type: 'select',
        options: ['Нове', 'Б/в — ідеальний', 'Б/в — відмінний', 'Б/в — добрий', 'Б/в — задовільний', 'На запчастини'] },
      { name: 'Бренд', value: 'The North Face', required: true, type: 'select',
        options: ['The North Face', 'Columbia', 'Patagonia', 'Jack Wolfskin', 'Helly Hansen', 'Salomon', 'Mammut', 'Arc\u2019teryx', 'Uniqlo', 'Zara', 'H&M', 'Інший бренд'] },
      { name: 'Розмір', value: 'M (46-48)', required: true, type: 'select',
        options: ['XS (42-44)', 'S (44-46)', 'M (46-48)', 'L (48-50)', 'XL (50-52)', 'XXL (52-54)', 'XXXL (54-56)'] },
      { name: 'Стать', value: 'Жіноча', required: true, type: 'select',
        options: ['Жіноча', 'Чоловіча', 'Унісекс', 'Дитяча'] },
      { name: 'Модель', value: 'Nuptse 700', type: 'input', placeholder: 'Наприклад: Nuptse 700' },
      { name: 'Колір', value: 'Чорний', type: 'multiselect',
        options: ['Чорний', 'Білий', 'Сірий', 'Синій', 'Червоний', 'Зелений', 'Коричневий', 'Бежевий', 'Рожевий', 'Жовтий'] },
      { name: 'Матеріал', value: 'Нейлон, пухо-перо', type: 'multiselect',
        options: ['Нейлон', 'Поліестер', 'Бавовна', 'Вовна', 'Шкіра', 'Замш', 'Пухо-перо', 'Синтепон', 'Флісова підкладка'] },
      { name: 'Сезон', value: 'Зима', type: 'select',
        options: ['Весна', 'Літо', 'Осінь', 'Зима', 'Демісезон'] },
      { name: 'Вага, г', value: '', type: 'number', placeholder: '0', unit: 'г' },
    ],
  };

  const [ad, setAd] = React.useState(DEFAULT_AD);

  // Keep photos in sync
  React.useEffect(() => {
    setAd(a => ({ ...a, photos }));
  }, [photos]);

  const reset = () => {
    setPhotos([
      { kind: 'jacket', hue: 28 },
      { kind: 'jacket', hue: 38 },
      { kind: 'jacket', hue: 22 },
    ]);
    setAd(DEFAULT_AD);
    setHint('');
  };

  const renderScreen = () => {
    switch (screen) {
      case 'onboarding':
        return <Onboarding onDone={() => setScreen('login')}/>;
      case 'login':
        return <Login onLogin={() => setScreen('home')} onGuest={() => setScreen('home')}/>;
      case 'home':
        return <Home
          photos={photos} setPhotos={setPhotos}
          hint={hint} setHint={setHint}
          onGenerate={() => setScreen('processing')}
          onLogout={() => setScreen('login')}
        />;
      case 'processing':
        return <Processing photos={photos} speedMs={tweaks.aiSpeedMs} onDone={() => setScreen('preview')}/>;
      case 'preview':
        return <Preview data={ad} setData={setAd}
          onBack={() => setScreen('home')}
          onPublish={() => setScreen('publishing')}
        />;
      case 'publishing':
        return <Publishing onDone={() => setScreen('success')}/>;
      case 'success':
        return <Success data={ad} onView={() => setScreen('success')} onNew={() => { reset(); setScreen('home'); }}/>;
      default:
        return <Onboarding onDone={() => setScreen('login')}/>;
    }
  };

  const device = (label) => (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <IOSDevice width={390} height={844} dark={tweaks.theme === 'dark'}>
        {renderScreen()}
      </IOSDevice>
      {label && <div className="screen-label">{label}</div>}
    </div>
  );

  if (tweaks.layout === 'all') {
    const screens = [
      ['onboarding', '01 · Onboarding'],
      ['login', '02 · Login'],
      ['home', '03 · Capture'],
      ['processing', '04 · AI'],
      ['preview', '05 · Preview & Edit'],
      ['success', '06 · Success'],
    ];
    return (
      <ThemeCtx.Provider value={ctx}>
        <div style={{ minHeight: '100vh', padding: '80px 24px 40px', position: 'relative' }}>
          <div className="overview-title">SellSnap · full flow</div>
          <div className="overview-sub">6 screens · AI-powered listing generator</div>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(400px, 1fr))',
            gap: 40, maxWidth: 1400, margin: '0 auto',
          }}>
            {screens.map(([s, label]) => (
              <div key={s} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }} data-screen-label={label}>
                <IOSDevice width={390} height={844} dark={tweaks.theme === 'dark'}>
                  <ScreenRender s={s} ad={ad} setAd={setAd} photos={photos} setPhotos={setPhotos}
                    hint={hint} setHint={setHint} setScreen={setScreen} speedMs={tweaks.aiSpeedMs}/>
                </IOSDevice>
                <div className="screen-label">{label}</div>
              </div>
            ))}
          </div>
          <TweaksPanel tweaks={tweaks} setTweak={setTweak} open={tweaksOpen} setOpen={setTweaksOpen} setScreen={setScreen}/>
        </div>
      </ThemeCtx.Provider>
    );
  }

  return (
    <ThemeCtx.Provider value={ctx}>
      <div className="stage" data-screen-label={screen}>
        {device()}
        <TweaksPanel tweaks={tweaks} setTweak={setTweak} open={tweaksOpen} setOpen={setTweaksOpen} setScreen={setScreen}/>
      </div>
    </ThemeCtx.Provider>
  );
}

function ScreenRender({ s, ad, setAd, photos, setPhotos, hint, setHint, setScreen, speedMs }) {
  switch (s) {
    case 'onboarding': return <Onboarding onDone={() => setScreen('login')}/>;
    case 'login':      return <Login onLogin={() => setScreen('home')} onGuest={() => setScreen('home')}/>;
    case 'home':       return <Home photos={photos} setPhotos={setPhotos} hint={hint} setHint={setHint}
                                    onGenerate={() => setScreen('processing')} onLogout={() => {}}/>;
    case 'processing': return <Processing photos={photos} speedMs={speedMs} onDone={() => {}}/>;
    case 'preview':    return <Preview data={ad} setData={setAd} onBack={() => {}} onPublish={() => {}}/>;
    case 'success':    return <Success data={ad} onView={() => {}} onNew={() => {}}/>;
    default: return null;
  }
}

function TweaksPanel({ tweaks, setTweak, open, setOpen, setScreen }) {
  if (!open) return null;
  const screens = ['onboarding', 'login', 'home', 'processing', 'preview', 'success'];
  return (
    <div className="tweaks on">
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <h3 style={{ margin: 0 }}>Tweaks</h3>
        <button onClick={() => setOpen(false)} style={{ border: 'none', background: 'transparent', cursor: 'pointer', color: '#7A5030', padding: 4 }}>✕</button>
      </div>

      <div className="tweak-row">
        <label>Theme</label>
        <div className="tweak-seg">
          {['light', 'dark'].map(t => (
            <button key={t} className={tweaks.theme === t ? 'sel' : ''} onClick={() => setTweak('theme', t)}>{t}</button>
          ))}
        </div>
      </div>

      <div className="tweak-row">
        <label>Layout</label>
        <div className="tweak-seg">
          {[['single','Single'],['all','All screens']].map(([v,l]) => (
            <button key={v} className={tweaks.layout === v ? 'sel' : ''} onClick={() => setTweak('layout', v)}>{l}</button>
          ))}
        </div>
      </div>

      <div className="tweak-row">
        <label>AI speed per stage: {tweaks.aiSpeedMs}ms</label>
        <input type="range" min="400" max="2400" step="100"
          value={tweaks.aiSpeedMs}
          onChange={e => setTweak('aiSpeedMs', parseInt(e.target.value, 10))}
          className="tweak-slider"/>
      </div>

      <div className="tweak-row">
        <label>Jump to screen</label>
        <div className="tweak-nav">
          {screens.map(s => (
            <button key={s} onClick={() => setScreen(s)}>{s}</button>
          ))}
        </div>
      </div>

      <div style={{ fontSize: 11, color: '#AA7040', marginTop: 8, lineHeight: 1.4 }}>
        Try: drag the price slider, edit text fields, flip screens, change theme.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
