# Maestro workspace config. Only top-level runnable flows are listed here so that
# `maestro test .maestro/` does not try to run the reusable files under subflows/
# as standalone flows. (appId is declared per-flow, not here.)
flows:
  - login.yaml
  - guest.yaml
  - generate_ad_with_photos.yaml
  - generate_ad_screenshots.yaml
  - generate_ad_screenshots_android.yaml
  - generate_ad_screenshots_dark_only.yaml
