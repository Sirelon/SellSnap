appId: com.sirelon.sellsnap
---
# Push test photos into the device gallery.
- runFlow: add_media.yaml

# Select 3 photos one at a time.
# DocumentsUI (Samsung / SDK 30 fallback) is single-select: each tap closes the picker
# immediately and returns one photo to the app — no confirm step needed.
# Modern Google Photo Picker (SDK 33/34) is multi-select but opening it three times
# and selecting one photo per session also works correctly.
- evalScript: ${output.counter = 0}
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "generate_ad_gallery_button"
      - waitForAnimationToEnd:
          timeout: 2000

      - runFlow:
          when:
            platform: Android
          commands:
            # DocumentsUI (Samsung / older devices)
            - tapOn:
                id: 'com.google.android.documentsui:id/thumbnail'
                index: ${output.counter}
                optional: true
            # Modern Media Provider (Pixel / AOSP Android 13+)
            - tapOn:
                id: 'com.google.android.providers.media.module:id/icon_thumbnail'
                index: ${output.counter}
                optional: true
            # Modern picker needs confirmation; DocumentsUI does not (optional = safe)
            - tapOn:
                text: "Add.*"
                optional: true
            - tapOn:
                text: "Done"
                optional: true

      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                id: 'PXGGridLayout-Info'
                index: ${output.counter}
                optional: true
            - tapOn:
                text: 'Photo, .*'
                index: ${output.counter}
                optional: true
            # "Add" is the locale-agnostic rid of the Done/Готово confirm button
            - tapOn:
                id: "Add"
                optional: true

      - evalScript: ${output.counter = output.counter + 1}

# Wait for all photos to appear in the app's photo grid.
- extendedWaitUntil:
    visible:
      id: "generate_ad_photos_grid"
    timeout: 15000

# Scroll to the bottom of the GenerateAd screen (ready for bottom screenshot).
- scrollUntilVisible:
    element:
      id: "generate_ad_prompt"
    direction: DOWN
    timeout: 10000
