appId: com.sirelon.sellsnap
---
# Clears state, walks through onboarding + consent + country picker, and taps
# "Continue with OLX" — which opens the Chrome Custom Tab login page.
# The script then PAUSES for the user to type the OLX password manually.
# COUNTRY required at runtime.

- runFlow: subflows/launch_through_consent.yaml

- scrollUntilVisible:
    element:
      id: "landing_continue_olx_button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "landing_continue_olx_button"

- extendedWaitUntil:
    visible:
      id: "country_row_pt"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "country_row_${COUNTRY}"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "country_row_${COUNTRY}"
- tapOn:
    id: "country_picker_continue_button"
