appId: com.sirelon.sellsnap
name: Setup For Country (triggers auth sheet, then exits)
---
# Clears app state, walks through onboarding + consent, selects the target
# country, and taps Continue — which triggers the iOS system auth sheet.
# The auth sheet is a SpringBoard dialog; Maestro CANNOT tap it.
# After this flow exits, the script pauses so the user can tap the dialog
# and complete OLX login manually.
# COUNTRY required at runtime.

- runFlow: subflows/launch_through_consent.yaml

- tapOn:
    id: "landing_continue_olx_button"

- extendedWaitUntil:
    visible:
      id: "country_row_${COUNTRY}"
    timeout: 10000

- tapOn:
    id: "country_row_${COUNTRY}"

- tapOn:
    id: "country_picker_continue_button"

# Flow exits here. The iOS auth sheet is now on screen.
# User must tap the Continue/Dalej/etc. button and log in.
